# Traefik routes for company 'wiener-linien' (generated by new-company.ps1)
http:
  routers:
    cp-wiener-linien:
      rule: "Host(`cp.wiener-linien.localhost`)"
      entryPoints: [web]
      service: cp-wiener-linien

    dp-wiener-linien:
      rule: "Host(`dp.wiener-linien.localhost`) && PathPrefix(`/public`)"
      entryPoints: [web]
      middlewares: [strip-public-wiener-linien]
      service: dp-wiener-linien

    ih-cs-wiener-linien:
      rule: "Host(`ih.wiener-linien.localhost`) && PathPrefix(`/cs`)"
      entryPoints: [web]
      middlewares: [strip-cs-wiener-linien]
      service: ih-identity-wiener-linien

    ih-did-wiener-linien:
      rule: "Host(`ih.wiener-linien.localhost`)"
      entryPoints: [web]
      service: ih-did-wiener-linien

  middlewares:
    strip-public-wiener-linien:
      stripPrefix:
        prefixes: ["/public"]
    strip-cs-wiener-linien:
      stripPrefix:
        prefixes: ["/cs"]

  services:
    cp-wiener-linien:
      loadBalancer:
        servers:
          - url: "http://controlplane-wiener-linien:8081"
    dp-wiener-linien:
      loadBalancer:
        servers:
          - url: "http://dataplane-wiener-linien:11002"
    ih-identity-wiener-linien:
      loadBalancer:
        servers:
          - url: "http://identityhub-wiener-linien:7081"
    ih-did-wiener-linien:
      loadBalancer:
        servers:
          - url: "http://identityhub-wiener-linien:7083"
