# Traefik routes for company 'oebb' (generated by new-company.ps1)
http:
  routers:
    cp-oebb:
      rule: "Host(`cp.oebb.localhost`)"
      entryPoints: [web]
      service: cp-oebb

    dp-oebb:
      rule: "Host(`dp.oebb.localhost`) && PathPrefix(`/public`)"
      entryPoints: [web]
      middlewares: [strip-public-oebb]
      service: dp-oebb

    ih-cs-oebb:
      rule: "Host(`ih.oebb.localhost`) && PathPrefix(`/cs`)"
      entryPoints: [web]
      middlewares: [strip-cs-oebb]
      service: ih-identity-oebb

    ih-did-oebb:
      rule: "Host(`ih.oebb.localhost`)"
      entryPoints: [web]
      service: ih-did-oebb

  middlewares:
    strip-public-oebb:
      stripPrefix:
        prefixes: ["/public"]
    strip-cs-oebb:
      stripPrefix:
        prefixes: ["/cs"]

  services:
    cp-oebb:
      loadBalancer:
        servers:
          - url: "http://controlplane-oebb:8081"
    dp-oebb:
      loadBalancer:
        servers:
          - url: "http://dataplane-oebb:11002"
    ih-identity-oebb:
      loadBalancer:
        servers:
          - url: "http://identityhub-oebb:7081"
    ih-did-oebb:
      loadBalancer:
        servers:
          - url: "http://identityhub-oebb:7083"
