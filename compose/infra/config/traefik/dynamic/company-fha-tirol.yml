# Traefik routes for company 'fha-tirol' (generated by new-company.ps1)
http:
  routers:
    cp-fha-tirol:
      rule: "Host(`cp.fha-tirol.localhost`)"
      entryPoints: [web]
      service: cp-fha-tirol

    dp-fha-tirol:
      rule: "Host(`dp.fha-tirol.localhost`) && PathPrefix(`/public`)"
      entryPoints: [web]
      middlewares: [strip-public-fha-tirol]
      service: dp-fha-tirol

    ih-cs-fha-tirol:
      rule: "Host(`ih.fha-tirol.localhost`) && PathPrefix(`/cs`)"
      entryPoints: [web]
      middlewares: [strip-cs-fha-tirol]
      service: ih-identity-fha-tirol

    ih-did-fha-tirol:
      rule: "Host(`ih.fha-tirol.localhost`)"
      entryPoints: [web]
      service: ih-did-fha-tirol

  middlewares:
    strip-public-fha-tirol:
      stripPrefix:
        prefixes: ["/public"]
    strip-cs-fha-tirol:
      stripPrefix:
        prefixes: ["/cs"]

  services:
    cp-fha-tirol:
      loadBalancer:
        servers:
          - url: "http://controlplane-fha-tirol:8081"
    dp-fha-tirol:
      loadBalancer:
        servers:
          - url: "http://dataplane-fha-tirol:11002"
    ih-identity-fha-tirol:
      loadBalancer:
        servers:
          - url: "http://identityhub-fha-tirol:7081"
    ih-did-fha-tirol:
      loadBalancer:
        servers:
          - url: "http://identityhub-fha-tirol:7083"
