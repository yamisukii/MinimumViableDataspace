# Traefik routes for company 'consumer' (generated by new-company.ps1)
http:
  routers:
    cp-consumer:
      rule: "Host(`cp.consumer.localhost`)"
      entryPoints: [web]
      service: cp-consumer

    dp-consumer:
      rule: "Host(`dp.consumer.localhost`) && PathPrefix(`/public`)"
      entryPoints: [web]
      middlewares: [strip-public-consumer]
      service: dp-consumer

    ih-cs-consumer:
      rule: "Host(`ih.consumer.localhost`) && PathPrefix(`/cs`)"
      entryPoints: [web]
      middlewares: [strip-cs-consumer]
      service: ih-identity-consumer

    ih-did-consumer:
      rule: "Host(`ih.consumer.localhost`)"
      entryPoints: [web]
      service: ih-did-consumer

  middlewares:
    strip-public-consumer:
      stripPrefix:
        prefixes: ["/public"]
    strip-cs-consumer:
      stripPrefix:
        prefixes: ["/cs"]

  services:
    cp-consumer:
      loadBalancer:
        servers:
          - url: "http://controlplane-consumer:8081"
    dp-consumer:
      loadBalancer:
        servers:
          - url: "http://dataplane-consumer:11002"
    ih-identity-consumer:
      loadBalancer:
        servers:
          - url: "http://identityhub-consumer:7081"
    ih-did-consumer:
      loadBalancer:
        servers:
          - url: "http://identityhub-consumer:7083"
