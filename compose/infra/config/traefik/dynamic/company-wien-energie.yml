# Traefik routes for company 'wien-energie' (generated by new-company.ps1)
http:
  routers:
    cp-wien-energie:
      rule: "Host(`cp.wien-energie.localhost`)"
      entryPoints: [web]
      service: cp-wien-energie

    dp-wien-energie:
      rule: "Host(`dp.wien-energie.localhost`) && PathPrefix(`/public`)"
      entryPoints: [web]
      middlewares: [strip-public-wien-energie]
      service: dp-wien-energie

    ih-cs-wien-energie:
      rule: "Host(`ih.wien-energie.localhost`) && PathPrefix(`/cs`)"
      entryPoints: [web]
      middlewares: [strip-cs-wien-energie]
      service: ih-identity-wien-energie

    ih-did-wien-energie:
      rule: "Host(`ih.wien-energie.localhost`)"
      entryPoints: [web]
      service: ih-did-wien-energie

  middlewares:
    strip-public-wien-energie:
      stripPrefix:
        prefixes: ["/public"]
    strip-cs-wien-energie:
      stripPrefix:
        prefixes: ["/cs"]

  services:
    cp-wien-energie:
      loadBalancer:
        servers:
          - url: "http://controlplane-wien-energie:8081"
    dp-wien-energie:
      loadBalancer:
        servers:
          - url: "http://dataplane-wien-energie:11002"
    ih-identity-wien-energie:
      loadBalancer:
        servers:
          - url: "http://identityhub-wien-energie:7081"
    ih-did-wien-energie:
      loadBalancer:
        servers:
          - url: "http://identityhub-wien-energie:7083"
