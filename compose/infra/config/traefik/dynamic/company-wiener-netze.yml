# Traefik routes for company 'wiener-netze' (generated by new-company.ps1)
http:
  routers:
    cp-wiener-netze:
      rule: "Host(`cp.wiener-netze.localhost`)"
      entryPoints: [web]
      service: cp-wiener-netze

    dp-wiener-netze:
      rule: "Host(`dp.wiener-netze.localhost`) && PathPrefix(`/public`)"
      entryPoints: [web]
      middlewares: [strip-public-wiener-netze]
      service: dp-wiener-netze

    ih-cs-wiener-netze:
      rule: "Host(`ih.wiener-netze.localhost`) && PathPrefix(`/cs`)"
      entryPoints: [web]
      middlewares: [strip-cs-wiener-netze]
      service: ih-identity-wiener-netze

    ih-did-wiener-netze:
      rule: "Host(`ih.wiener-netze.localhost`)"
      entryPoints: [web]
      service: ih-did-wiener-netze

  middlewares:
    strip-public-wiener-netze:
      stripPrefix:
        prefixes: ["/public"]
    strip-cs-wiener-netze:
      stripPrefix:
        prefixes: ["/cs"]

  services:
    cp-wiener-netze:
      loadBalancer:
        servers:
          - url: "http://controlplane-wiener-netze:8081"
    dp-wiener-netze:
      loadBalancer:
        servers:
          - url: "http://dataplane-wiener-netze:11002"
    ih-identity-wiener-netze:
      loadBalancer:
        servers:
          - url: "http://identityhub-wiener-netze:7081"
    ih-did-wiener-netze:
      loadBalancer:
        servers:
          - url: "http://identityhub-wiener-netze:7083"
