# Traefik routes for company 'fha-wien' (generated by new-company.ps1)
http:
  routers:
    cp-fha-wien:
      rule: "Host(`cp.fha-wien.localhost`)"
      entryPoints: [web]
      service: cp-fha-wien

    dp-fha-wien:
      rule: "Host(`dp.fha-wien.localhost`) && PathPrefix(`/public`)"
      entryPoints: [web]
      middlewares: [strip-public-fha-wien]
      service: dp-fha-wien

    ih-cs-fha-wien:
      rule: "Host(`ih.fha-wien.localhost`) && PathPrefix(`/cs`)"
      entryPoints: [web]
      middlewares: [strip-cs-fha-wien]
      service: ih-identity-fha-wien

    ih-did-fha-wien:
      rule: "Host(`ih.fha-wien.localhost`)"
      entryPoints: [web]
      service: ih-did-fha-wien

  middlewares:
    strip-public-fha-wien:
      stripPrefix:
        prefixes: ["/public"]
    strip-cs-fha-wien:
      stripPrefix:
        prefixes: ["/cs"]

  services:
    cp-fha-wien:
      loadBalancer:
        servers:
          - url: "http://controlplane-fha-wien:8081"
    dp-fha-wien:
      loadBalancer:
        servers:
          - url: "http://dataplane-fha-wien:11002"
    ih-identity-fha-wien:
      loadBalancer:
        servers:
          - url: "http://identityhub-fha-wien:7081"
    ih-did-fha-wien:
      loadBalancer:
        servers:
          - url: "http://identityhub-fha-wien:7083"
