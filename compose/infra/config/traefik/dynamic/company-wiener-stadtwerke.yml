# Traefik routes for company 'wiener-stadtwerke' (generated by new-company.ps1)
http:
  routers:
    cp-wiener-stadtwerke:
      rule: "Host(`cp.wiener-stadtwerke.localhost`)"
      entryPoints: [web]
      service: cp-wiener-stadtwerke

    dp-wiener-stadtwerke:
      rule: "Host(`dp.wiener-stadtwerke.localhost`) && PathPrefix(`/public`)"
      entryPoints: [web]
      middlewares: [strip-public-wiener-stadtwerke]
      service: dp-wiener-stadtwerke

    ih-cs-wiener-stadtwerke:
      rule: "Host(`ih.wiener-stadtwerke.localhost`) && PathPrefix(`/cs`)"
      entryPoints: [web]
      middlewares: [strip-cs-wiener-stadtwerke]
      service: ih-identity-wiener-stadtwerke

    ih-did-wiener-stadtwerke:
      rule: "Host(`ih.wiener-stadtwerke.localhost`)"
      entryPoints: [web]
      service: ih-did-wiener-stadtwerke

  middlewares:
    strip-public-wiener-stadtwerke:
      stripPrefix:
        prefixes: ["/public"]
    strip-cs-wiener-stadtwerke:
      stripPrefix:
        prefixes: ["/cs"]

  services:
    cp-wiener-stadtwerke:
      loadBalancer:
        servers:
          - url: "http://controlplane-wiener-stadtwerke:8081"
    dp-wiener-stadtwerke:
      loadBalancer:
        servers:
          - url: "http://dataplane-wiener-stadtwerke:11002"
    ih-identity-wiener-stadtwerke:
      loadBalancer:
        servers:
          - url: "http://identityhub-wiener-stadtwerke:7081"
    ih-did-wiener-stadtwerke:
      loadBalancer:
        servers:
          - url: "http://identityhub-wiener-stadtwerke:7083"
