# Traefik routes for company 'provider' (generated by new-company.ps1)
http:
  routers:
    cp-provider:
      rule: "Host(`cp.provider.localhost`)"
      entryPoints: [web]
      service: cp-provider

    dp-provider:
      rule: "Host(`dp.provider.localhost`) && PathPrefix(`/public`)"
      entryPoints: [web]
      middlewares: [strip-public-provider]
      service: dp-provider

    ih-cs-provider:
      rule: "Host(`ih.provider.localhost`) && PathPrefix(`/cs`)"
      entryPoints: [web]
      middlewares: [strip-cs-provider]
      service: ih-identity-provider

    ih-did-provider:
      rule: "Host(`ih.provider.localhost`)"
      entryPoints: [web]
      service: ih-did-provider

  middlewares:
    strip-public-provider:
      stripPrefix:
        prefixes: ["/public"]
    strip-cs-provider:
      stripPrefix:
        prefixes: ["/cs"]

  services:
    cp-provider:
      loadBalancer:
        servers:
          - url: "http://controlplane-provider:8081"
    dp-provider:
      loadBalancer:
        servers:
          - url: "http://dataplane-provider:11002"
    ih-identity-provider:
      loadBalancer:
        servers:
          - url: "http://identityhub-provider:7081"
    ih-did-provider:
      loadBalancer:
        servers:
          - url: "http://identityhub-provider:7083"
