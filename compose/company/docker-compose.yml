# Company stack template - one stack per dataspace participant ("Unternehmen").
# Parameterized via env file (see compose/companies/<name>/.env):
#   COMPANY           - lowercase name, used in hostnames, DIDs, DB names, vault aliases
#   SEED_DEMO_ASSETS  - "true" to additionally create the legacy demo assets (asset-1/2/3)
#
# Deploy: podman compose -p mvd-<name> --env-file compose/companies/<name>/.env \
#           -f compose/company/docker-compose.yml up -d
#
# Internal hostnames: controlplane-<company>, dataplane-<company>, identityhub-<company>
# External (Traefik):  cp.<company>.localhost, dp.<company>.localhost, ih.<company>.localhost
# DID:                 did:web:identityhub-<company>%3A7083:<company>

networks:
  dataspace:
    external: true
    name: dataspace

services:
  # One-shot: create this company's databases in the shared Postgres. Idempotent.
  init-db:
    image: postgres:17.7-alpine
    container_name: init-db-${COMPANY}
    restart: "no"
    entrypoint: ["sh", "/scripts/init-db.sh"]
    environment:
      COMPANY: ${COMPANY}
      PGHOST: postgres
      PGUSER: admin
      PGPASSWORD: admin
    volumes:
      - ./scripts/init-db.sh:/scripts/init-db.sh:ro
    networks:
      dataspace: {}

  # One-shot: create this company's AES key in the shared Vault. Idempotent.
  init-vault:
    image: hashicorp/vault:latest
    container_name: init-vault-${COMPANY}
    restart: "no"
    entrypoint: ["sh", "/scripts/init-vault.sh"]
    environment:
      COMPANY: ${COMPANY}
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root"
    volumes:
      - ./scripts/init-vault.sh:/scripts/init-vault.sh:ro
    networks:
      dataspace: {}

  controlplane:
    image: localhost/mvd-controlplane-local:latest
    container_name: cp-${COMPANY}
    restart: unless-stopped
    pull_policy: never
    environment:
      edc.hostname: "controlplane-${COMPANY}"
      edc.vault.hashicorp.url: "http://vault:8200"
      edc.vault.hashicorp.token: "root"
      edc.participant.id: "did:web:identityhub-${COMPANY}%3A7083:${COMPANY}"
      edc.iam.did.web.use.https: "false"
      edc.iam.credential.revocation.mimetype: "application/json"
      edc.iam.sts.oauth.token.url: "http://identityhub-${COMPANY}:7084/api/sts/token"
      edc.iam.sts.oauth.client.id: "did:web:identityhub-${COMPANY}%3A7083:${COMPANY}"
      edc.iam.sts.oauth.client.secret.alias: "${COMPANY}-participant-sts-client-secret"
      web.http.port: "8080"
      web.http.path: "/api"
      web.http.protocol.port: "8082"
      web.http.protocol.path: "/api/dsp"
      web.http.management.port: "8081"
      web.http.management.path: "/api/mgmt"
      web.http.control.port: "8083"
      web.http.control.path: "/api/control"
      edc.datasource.default.url: "jdbc:postgresql://postgres:5432/${COMPANY}_controlplane"
      edc.datasource.default.user: "cp"
      edc.datasource.default.password: "cp"
      edc.sql.schema.autocreate: "true"
      edc.encryption.aes.key.alias: "${COMPANY}-aes-key"
      edc.iam.oauth2.issuer: "http://keycloak:8080/realms/mvd"
      edc.iam.oauth2.jwks.url: "http://keycloak:8080/realms/mvd/protocol/openid-connect/certs"
      edc.iam.dcp.scopes.membership.id: "membership-scope"
      edc.iam.dcp.scopes.membership.type: "DEFAULT"
      edc.iam.dcp.scopes.membership.value: "org.eclipse.dspace.dcp.vc.type:MembershipCredential:read"
      edc.iam.dcp.scopes.manufacturer.id: "manufacturer-scope"
      edc.iam.dcp.scopes.manufacturer.type: "POLICY"
      edc.iam.dcp.scopes.manufacturer.value: "org.eclipse.dspace.dcp.vc.type:ManufacturerCredential:read"
      edc.iam.dcp.scopes.manufacturer.prefix-mapping: "ManufacturerCredential"
      edc.iam.trusted-issuer.issuer.id: "did:web:issuerservice%3A10016:issuer"
    depends_on:
      init-db:
        condition: service_completed_successfully
      init-vault:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/check/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      dataspace:
        aliases: ["controlplane-${COMPANY}"]

  dataplane:
    image: localhost/mvd-dataplane-local:latest
    container_name: dp-${COMPANY}
    restart: unless-stopped
    pull_policy: never
    environment:
      edc.hostname: "dataplane-${COMPANY}"
      dataplane.id: "${COMPANY}-dataplane"
      edc.transfer.proxy.token.verifier.publickey.alias: "${COMPANY}-dataplane-private"
      edc.transfer.proxy.token.signer.privatekey.alias: "${COMPANY}-dataplane-public"
      edc.dpf.selector.url: "http://controlplane-${COMPANY}:8083/api/control/v1/dataplanes"
      web.http.port: "8080"
      web.http.path: "/api"
      web.http.control.port: "8083"
      web.http.control.path: "/api/control"
      web.http.public.port: "11002"
      web.http.public.path: "/api/public"
      web.http.certs.port: "8186"
      web.http.certs.path: "/api/data"
      edc.vault.hashicorp.url: "http://vault:8200"
      edc.vault.hashicorp.token: "root"
      edc.datasource.default.url: "jdbc:postgresql://postgres:5432/${COMPANY}_dataplane"
      edc.datasource.default.user: "dp"
      edc.datasource.default.password: "dp"
      edc.sql.schema.autocreate: "true"
    depends_on:
      controlplane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/check/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      dataspace:
        aliases: ["dataplane-${COMPANY}"]

  identityhub:
    image: ghcr.io/eclipse-edc/minimumviabledataspace/identity-hub:latest
    container_name: ih-${COMPANY}
    restart: unless-stopped
    environment:
      edc.hostname: "identityhub-${COMPANY}"
      edc.iam.credentia.revocation.mimetype: "application/json"
      edc.iam.did.web.use.https: "false"
      edc.ih.iam.publickey.alias: "${COMPANY}-publickey-alias"
      web.http.port: "7080"
      web.http.path: "/api"
      web.http.identity.port: "7081"
      web.http.identity.path: "/api/identity"
      web.http.identity.auth.key: "password"
      web.http.credentials.port: "7082"
      web.http.credentials.path: "/api/credentials"
      web.http.did.port: "7083"
      web.http.did.path: "/"
      web.http.sts.port: "7084"
      web.http.sts.path: "/api/sts"
      edc.vault.hashicorp.url: "http://vault:8200"
      edc.vault.hashicorp.token: "root"
      edc.datasource.default.url: "jdbc:postgresql://postgres:5432/${COMPANY}_identityhub"
      edc.datasource.default.user: "ih"
      edc.datasource.default.password: "ih"
      edc.sql.schema.autocreate: "true"
      edc.iam.accesstoken.jti.validation: "true"
      edc.iam.credential.renewal.graceperiod: "86400"
      edc.encryption.aes.key.alias: "${COMPANY}-aes-key"
      edc.iam.oauth2.issuer: "http://keycloak:8080/realms/mvd"
      edc.iam.oauth2.jwks.url: "http://keycloak:8080/realms/mvd/protocol/openid-connect/certs"
    depends_on:
      init-db:
        condition: service_completed_successfully
      init-vault:
        condition: service_completed_successfully
    networks:
      dataspace:
        aliases: ["identityhub-${COMPANY}"]

  # One-shot: holder in IssuerService, participant context in IdentityHub,
  # credential issuance (Membership + Manufacturer). Idempotent.
  seed-identity:
    image: curlimages/curl:latest
    container_name: seed-identity-${COMPANY}
    restart: "no"
    entrypoint: ["sh", "/scripts/seed-identity.sh"]
    environment:
      COMPANY: ${COMPANY}
      KC_HOST: "http://keycloak:8080"
      PROVISIONER_CLIENT_ID: "provisioner"
      PROVISIONER_CLIENT_SECRET: "provisioner-secret"
      ADMIN_CLIENT_ID: "admin"
      ADMIN_CLIENT_SECRET: "edc-v-admin-secret"
      IH_URL: "http://identityhub-${COMPANY}:7081/api/identity/v1alpha/participants/"
      IH_BASE: "http://identityhub-${COMPANY}"
      CP_BASE: "http://controlplane-${COMPANY}"
      PARTICIPANT_DID: "did:web:identityhub-${COMPANY}%3A7083:${COMPANY}"
      PARTICIPANT_ID: "${COMPANY}-participant"
      ISSUER_DID: "did:web:issuerservice%3A10016:issuer"
      ISSUER_ADMIN_URL: "http://issuerservice:10013/api/admin/v1alpha"
      ISSUER_CLIENT_ID: "issuer"
      ISSUER_CLIENT_SECRET: "issuer-secret"
    volumes:
      - ./scripts/seed-identity.sh:/scripts/seed-identity.sh:ro
    depends_on:
      identityhub:
        condition: service_started
    networks:
      dataspace: {}

  # One-shot: CEL expressions, policies, demo asset, contract definition and
  # dataplane registration in this company's controlplane. Idempotent.
  seed-controlplane:
    image: curlimages/curl:latest
    container_name: seed-controlplane-${COMPANY}
    restart: "no"
    entrypoint: ["sh", "/scripts/seed-controlplane.sh"]
    environment:
      COMPANY: ${COMPANY}
      SEED_DEMO_ASSETS: ${SEED_DEMO_ASSETS:-false}
      CP_BASE: "http://controlplane-${COMPANY}"
      DP_BASE: "http://dataplane-${COMPANY}"
      PARTICIPANT_DID: "did:web:identityhub-${COMPANY}%3A7083:${COMPANY}"
    volumes:
      - ./scripts/seed-controlplane.sh:/scripts/seed-controlplane.sh:ro
    depends_on:
      controlplane:
        condition: service_healthy
    networks:
      dataspace: {}
