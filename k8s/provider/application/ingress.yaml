apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: controlplane
  namespace: provider
spec:
  rules:
    - host: cp.provider.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: controlplane
                port:
                  number: 8081
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dataplane
  namespace: provider
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: provider-strip-public@kubernetescrd
spec:
  rules:
    - host: dp.provider.localhost
      http:
        paths:
          - path: /public
            pathType: Prefix
            backend:
              service:
                name: dataplane
                port:
                  number: 11002
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-public
  namespace: provider
spec:
  stripPrefix:
    prefixes:
      - /public
